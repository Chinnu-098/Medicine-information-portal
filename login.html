<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - MedInfo Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="auth-page">


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand d-flex align-items-center gap-2"
            href="index.html">

            <span class="brand-icon">

                <i class="bi bi-capsule-pill"></i>

            </span>

            <strong>MedInfo Portal</strong>

        </a>


        <a
            href="index.html"
            class="btn btn-outline-primary">

            <i class="bi bi-house"></i>

            Home

        </a>

    </div>

</nav>



<!-- LOGIN -->

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-sm-10 col-md-7 col-lg-5">


                <div class="auth-card">


                    <!-- ICON -->

                    <div class="auth-icon">

                        <i
                            class="bi bi-person-circle">
                        </i>

                    </div>


                    <div class="text-center mb-4">

                        <h2 class="fw-bold">

                            Welcome Back

                        </h2>

                        <p class="text-muted">

                            Login to your MedInfo account

                        </p>

                    </div>



                    <!-- ALERT -->

                    <div
                        id="loginMessage"
                        class="alert"
                        style="display:none;">

                    </div>



                    <!-- FORM -->

                    <form id="loginForm">


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="loginEmail"
                                class="form-label fw-semibold">

                                Email Address

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>


                                <input
                                    type="email"
                                    id="loginEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required>

                            </div>

                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="loginPassword"
                                class="form-label fw-semibold">

                                Password

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    id="loginPassword"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required>


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="togglePassword"
                                    aria-label="Show password">

                                    <i
                                        class="bi bi-eye">
                                    </i>

                                </button>

                            </div>

                        </div>



                        <!-- REMEMBER -->

                        <div
                            class="d-flex
                                   justify-content-between
                                   align-items-center
                                   mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="rememberMe">

                                <label
                                    class="form-check-label"
                                    for="rememberMe">

                                    Remember me

                                </label>

                            </div>


                            <a
                                href="#"
                                class="small text-decoration-none"
                                onclick="showForgotMessage(event)">

                                Forgot password?

                            </a>

                        </div>



                        <!-- LOGIN -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100 py-2">

                            <i
                                class="bi bi-box-arrow-in-right">
                            </i>

                            Login

                        </button>


                    </form>



                    <!-- REGISTER -->

                    <div class="text-center mt-4">

                        <span class="text-muted">

                            Don't have an account?

                        </span>


                        <a
                            href="register.html"
                            class="fw-semibold text-decoration-none">

                            Create Account

                        </a>

                    </div>


                    <!-- ADMIN -->

                    <div
                        class="text-center mt-4 pt-3 border-top">

                        <small class="text-muted">

                            Are you an administrator?

                        </small>


                        <br>


                        <a
                            href="admin/login.html"
                            class="small fw-semibold text-decoration-none">

                            Admin Login

                            <i class="bi bi-arrow-right"></i>

                        </a>

                    </div>


                </div>


            </div>

        </div>

    </div>

</section>



<!-- FOOTER -->

<footer class="footer-section py-4">

    <div class="container text-center">

        <small>

            © 2026 MedInfo Portal |
            Educational Purpose Only

        </small>

    </div>

</footer>



<!-- BOOTSTRAP -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- AUTH -->

<script src="js/auth.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const form =
            document.getElementById(
                "loginForm"
            );


        const message =
            document.getElementById(
                "loginMessage"
            );


        const password =
            document.getElementById(
                "loginPassword"
            );


        const toggle =
            document.getElementById(
                "togglePassword"
            );



        /* SHOW / HIDE PASSWORD */

        toggle.addEventListener(
            "click",
            function () {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    toggle.innerHTML =
                        '<i class="bi bi-eye-slash"></i>';

                } else {

                    password.type = "password";

                    toggle.innerHTML =
                        '<i class="bi bi-eye"></i>';

                }

            }
        );



        /* LOGIN */

        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                const passwordValue =
                    password.value;


                const result =
                    loginUser(
                        email,
                        passwordValue
                    );


                if (result.success) {


                    message.className =
                        "alert alert-success";


                    message.textContent =
                        "Login successful! Redirecting...";


                    message.style.display =
                        "block";


                    setTimeout(
                        function () {

                            window.location.href =
                                "profile.html";

                        },
                        700
                    );


                } else {


                    message.className =
                        "alert alert-danger";


                    message.textContent =
                        result.message;


                    message.style.display =
                        "block";

                }

            }
        );

    }
);



/* FORGOT PASSWORD MESSAGE */

function showForgotMessage(event) {

    event.preventDefault();


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.className =
        "alert alert-info";


    message.textContent =
        "For this demo project, password recovery is not connected yet. Please use your registered password.";


    message.style.display =
        "block";

}

</script>


</body>

</html>
