<!-- ================= REGISTRATION ================= -->

<section class="py-5 bg-light">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card border-0 shadow">

                    <div class="card-body p-4 p-md-5">


                        <!-- TITLE -->

                        <div class="text-center mb-4">

                            <div class="feature-icon mx-auto mb-3">

                                <i class="bi bi-person-plus"></i>

                            </div>

                            <h2 class="fw-bold text-primary">

                                Create Account

                            </h2>

                            <p class="text-muted">

                                Register to access the Medicine Information Portal.

                            </p>

                        </div>



                        <!-- ALERT -->

                        <div
                            id="registerMessage"
                            class="alert"
                            style="display: none;">
                        </div>



                        <!-- FORM -->

                        <form id="registerForm">


                            <!-- NAME -->

                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>



                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>



                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label fw-semibold">

                                    Password

                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="Create a password"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('password', this)">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>



                            <!-- CONFIRM PASSWORD -->

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label fw-semibold">

                                    Confirm Password

                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        placeholder="Confirm your password"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('confirmPassword', this)">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>



                            <!-- REGISTER BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 py-2">

                                <i class="bi bi-person-plus"></i>

                                Create Account

                            </button>


                        </form>



                        <!-- LOGIN LINK -->

                        <div class="text-center mt-4">

                            <p class="mb-0">

                                Already have an account?

                                <a
                                    href="login.html"
                                    class="text-primary fw-semibold">

                                    Login here

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
