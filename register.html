<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - MedInfo Portal</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Website CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="auth-page">


<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand d-flex align-items-center gap-2"
            href="index.html">

            <span class="brand-icon">

                <i class="bi bi-capsule-pill"></i>

            </span>

            <strong>MedInfo Portal</strong>

        </a>


        <a
            href="index.html"
            class="btn btn-outline-primary">

            <i class="bi bi-house"></i>

            Home

        </a>

    </div>

</nav>



<!-- =========================================
     REGISTER SECTION
========================================= -->

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-sm-10 col-md-8 col-lg-5">


                <div class="auth-card">


                    <!-- ICON -->

                    <div class="auth-icon">

                        <i class="bi bi-person-plus-fill"></i>

                    </div>


                    <!-- TITLE -->

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">

                            Create Account

                        </h2>

                        <p class="text-muted">

                            Join MedInfo Portal today

                        </p>

                    </div>



                    <!-- MESSAGE -->

                    <div
                        id="registerMessage"
                        class="alert"
                        style="display:none;">

                    </div>



                    <!-- FORM -->

                    <form id="registerForm">


                        <!-- NAME -->

                        <div class="mb-3">

                            <label
                                for="registerName"
                                class="form-label fw-semibold">

                                Full Name

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-person"></i>

                                </span>


                                <input
                                    type="text"
                                    id="registerName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    minlength="2"
                                    required>

                            </div>

                        </div>



                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="registerEmail"
                                class="form-label fw-semibold">

                                Email Address

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>


                                <input
                                    type="email"
                                    id="registerEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required>

                            </div>

                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="registerPassword"
                                class="form-label fw-semibold">

                                Password

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    id="registerPassword"
                                    class="form-control"
                                    placeholder="Minimum 6 characters"
                                    autocomplete="new-password"
                                    minlength="6"
                                    required>


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="toggleRegisterPassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label fw-semibold">

                                Confirm Password

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-shield-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Re-enter your password"
                                    autocomplete="new-password"
                                    minlength="6"
                                    required>


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="toggleConfirmPassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>



                        <!-- TERMS -->

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="agreeTerms"
                                required>


                            <label
                                class="form-check-label"
                                for="agreeTerms">

                                I agree to use this portal
                                for educational purposes.

                            </label>

                        </div>



                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100 py-2">

                            <i class="bi bi-person-plus"></i>

                            Create Account

                        </button>


                    </form>



                    <!-- LOGIN -->

                    <div class="text-center mt-4">

                        <span class="text-muted">

                            Already have an account?

                        </span>


                        <a
                            href="login.html"
                            class="fw-semibold text-decoration-none">

                            Login

                        </a>

                    </div>



                    <!-- ADMIN -->

                    <div
                        class="text-center mt-4 pt-3 border-top">

                        <small class="text-muted">

                            Administrator?

                        </small>


                        <a
                            href="admin/register.html"
                            class="small fw-semibold text-decoration-none">

                            Admin Registration

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</section>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="footer-section py-4">

    <div class="container text-center">

        <small>

            © 2026 MedInfo Portal |
            Educational Purpose Only

        </small>

    </div>

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Authentication JS -->

<script src="js/auth.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const form =
            document.getElementById(
                "registerForm"
            );


        const message =
            document.getElementById(
                "registerMessage"
            );


        const password =
            document.getElementById(
                "registerPassword"
            );


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );


        const togglePassword =
            document.getElementById(
                "toggleRegisterPassword"
            );


        const toggleConfirm =
            document.getElementById(
                "toggleConfirmPassword"
            );



        /* =================================
           PASSWORD VISIBILITY
        ================================= */

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    togglePassword.innerHTML =
                        '<i class="bi bi-eye-slash"></i>';

                } else {

                    password.type = "password";

                    togglePassword.innerHTML =
                        '<i class="bi bi-eye"></i>';

                }

            }
        );



        toggleConfirm.addEventListener(
            "click",
            function () {

                if (
                    confirmPassword.type === "password"
                ) {

                    confirmPassword.type = "text";

                    toggleConfirm.innerHTML =
                        '<i class="bi bi-eye-slash"></i>';

                } else {

                    confirmPassword.type = "password";

                    toggleConfirm.innerHTML =
                        '<i class="bi bi-eye"></i>';

                }

            }
        );



        /* =================================
           REGISTER
        ================================= */

        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("registerName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("registerEmail")
                        .value
                        .trim();


                const passwordValue =
                    password.value;


                const confirmValue =
                    confirmPassword.value;



                /* Password Match */

                if (
                    passwordValue !==
                    confirmValue
                ) {

                    showRegisterMessage(
                        "Passwords do not match.",
                        "danger"
                    );

                    return;

                }



                /* Register */

                const result =
                    registerUser(
                        name,
                        email,
                        passwordValue
                    );


                if (result.success) {


                    showRegisterMessage(
                        "Account created successfully! Redirecting to login...",
                        "success"
                    );


                    form.reset();


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1000
                    );


                } else {


                    showRegisterMessage(
                        result.message,
                        "danger"
                    );

                }

            }
        );

    }
);



/* =========================================
   MESSAGE FUNCTION
========================================= */

function showRegisterMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "registerMessage"
        );


    message.className =
        "alert alert-" + type;


    message.textContent =
        text;


    message.style.display =
        "block";

}

</script>


</body>

</html>
